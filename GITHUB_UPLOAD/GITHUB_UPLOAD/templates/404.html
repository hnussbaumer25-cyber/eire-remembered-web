{% extends "base.html" %}

{% block title %}Page Not Found - Éire Remembered{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">
            Sorry, the page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('home') }}" class="btn btn-large btn-primary">Go Home</a>
            <a href="{{ url_for('articles') }}" class="btn btn-large btn-secondary">Browse Articles</a>
        </div>
    </div>
</div>

<style>
.error-page {
    text-align: center;
    padding: 100px 20px;
}

.error-code {
    font-size: 120px;
    color: #1a5f1a;
    margin-bottom: 20px;
}

.error-message {
    font-size: 42px;
    color: #2c3e50;
    margin-bottom: 20px;
}

.error-description {
    font-size: 24px;
    color: #7f8c8d;
    margin-bottom: 50px;
}

.error-actions {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
{% endblock %}
